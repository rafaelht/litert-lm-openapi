services:
  litert-lm-openapi:
    build: .
    container_name: litert-lm-openapi
    restart: unless-stopped
    environment:
      MODEL_PATH: ${MODEL_PATH:-/models/gemma-4-E2B-it.litertlm/model.litertlm}
      SERVER_PORT: ${SERVER_PORT:-8000}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-1800}
      MAX_ACTIVE_CONVERSATIONS: ${MAX_ACTIVE_CONVERSATIONS:-5}
      CONTEXT_ROLLOVER_THRESHOLD_TOKENS: ${CONTEXT_ROLLOVER_THRESHOLD_TOKENS:-3400}
      CONTEXT_ROLLOVER_RECENT_MESSAGES: ${CONTEXT_ROLLOVER_RECENT_MESSAGES:-4}
      CONTEXT_ROLLOVER_RECENT_TOKEN_BUDGET: ${CONTEXT_ROLLOVER_RECENT_TOKEN_BUDGET:-1024}
      MAX_NUM_IMAGES: ${MAX_NUM_IMAGES:-0}
      MODEL_PROFILE: ${MODEL_PROFILE:-profiles/default.yaml}
      CPU_THREADS: ${CPU_THREADS:-4}
      MAX_NUM_TOKENS: ${MAX_NUM_TOKENS:-4096}
      ENABLE_XNNPACK_CACHE: ${ENABLE_XNNPACK_CACHE:-false}
      USE_RINGBUFFERS_LOCAL_ATTENTION: ${USE_RINGBUFFERS_LOCAL_ATTENTION:-true}
      ENABLE_BENCHMARK: ${ENABLE_BENCHMARK:-false}
      ENABLE_ADMIN_LLM: ${ENABLE_ADMIN_LLM:-false}
      THINKING_TOKEN_BUDGET: ${THINKING_TOKEN_BUDGET:-384}
    ports:
      - "${HOST_PORT:-8005}:${SERVER_PORT:-8000}"
    volumes:
      - /volume2/docker/litertlm/litert-home/models:/models:ro
      - ./profiles:/app/profiles:ro
    deploy:
      resources:
        limits:
          memory: 3G
