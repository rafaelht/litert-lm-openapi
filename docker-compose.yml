services:
  litert-lm-openapi:
    build: .
    container_name: litert-lm-openapi
    restart: unless-stopped
    environment:
      MODELS_DIR: ${MODELS_DIR_INTERNAL:-/models}
      MODEL_PATH: ${MODEL_PATH:-/models/gemma-4-E2B-it.litertlm/model.litertlm}
      PRELOAD_FIRST_MODEL: ${PRELOAD_FIRST_MODEL:-false}
      SERVER_PORT: ${SERVER_PORT:-8000}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-600}
      MAX_ACTIVE_CONVERSATIONS: ${MAX_ACTIVE_CONVERSATIONS:-10}
      MAX_CONCURRENT_GENERATIONS: ${MAX_CONCURRENT_GENERATIONS:-1}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      CONTEXT_ROLLOVER_THRESHOLD_TOKENS: ${CONTEXT_ROLLOVER_THRESHOLD_TOKENS:-2600}
      CONTEXT_ROLLOVER_HEADROOM_TOKENS: ${CONTEXT_ROLLOVER_HEADROOM_TOKENS:-1500}
      CONTEXT_ROLLOVER_RECENT_MESSAGES: ${CONTEXT_ROLLOVER_RECENT_MESSAGES:-4}
      CONTEXT_ROLLOVER_RECENT_TOKEN_BUDGET: ${CONTEXT_ROLLOVER_RECENT_TOKEN_BUDGET:-1024}
      ENGINE_TTL: ${ENGINE_TTL:-0}
      ENGINE_TTL_SECONDS: ${ENGINE_TTL_SECONDS:-0}
      ENABLE_WARM_POOL: ${ENABLE_WARM_POOL:-false}
      MAX_NUM_IMAGES: ${MAX_NUM_IMAGES:-0}
      MODEL_PROFILE: ${MODEL_PROFILE:-profiles/default.yaml}
      CPU_THREADS: ${CPU_THREADS:-4}
      MAX_NUM_TOKENS: ${MAX_NUM_TOKENS:-4096}
      ENABLE_XNNPACK_CACHE: ${ENABLE_XNNPACK_CACHE:-false}
      USE_RINGBUFFERS_LOCAL_ATTENTION: ${USE_RINGBUFFERS_LOCAL_ATTENTION:-true}
      ENABLE_BENCHMARK: ${ENABLE_BENCHMARK:-false}
      ENABLE_ADMIN_LLM: ${ENABLE_ADMIN_LLM:-false}
      THINKING_TOKEN_BUDGET: ${THINKING_TOKEN_BUDGET:-384}
      ENABLE_THINKING: ${ENABLE_THINKING:-false}
      ENABLE_TOOLS: ${ENABLE_TOOLS:-true}
      ENABLE_TOOL_CALLING: ${ENABLE_TOOL_CALLING:-true}
      FORCE_STATIC_MAX_TOKENS: ${FORCE_STATIC_MAX_TOKENS:-false}
      ENABLE_SPECULATIVE_DECODING: ${ENABLE_SPECULATIVE_DECODING:-false}
    ports:
      - "${HOST_PORT:-8005}:${SERVER_PORT:-8000}"
    volumes:
      - ${MODELS_DIR:-/volume2/docker/litertlm/litert-home/models}:/models
      - ./profiles:/app/profiles:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4G
