services:
  litert-lm-openapi:
    build: .
    container_name: litert-lm-openapi
    restart: unless-stopped
    environment:
      MODEL_PATH: ${MODEL_PATH:-/models/gemma-4-E2B-it.litertlm/model.litertlm}
      SERVER_PORT: ${SERVER_PORT:-8000}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-1800}
      ENGINE_TTL_SECONDS: ${ENGINE_TTL_SECONDS:-0}
      MAX_CONCURRENT_GENERATIONS: ${MAX_CONCURRENT_GENERATIONS:-1}
      MAX_ACTIVE_CONVERSATIONS: ${MAX_ACTIVE_CONVERSATIONS:-20}
      ENABLE_WARM_POOL: ${ENABLE_WARM_POOL:-false}
      CONTEXT_ROLLOVER_THRESHOLD_TOKENS: ${CONTEXT_ROLLOVER_THRESHOLD_TOKENS:-4096}
      CONTEXT_ROLLOVER_RECENT_MESSAGES: ${CONTEXT_ROLLOVER_RECENT_MESSAGES:-2}
      CONTEXT_ROLLOVER_RECENT_TOKEN_BUDGET: ${CONTEXT_ROLLOVER_RECENT_TOKEN_BUDGET:-512}
      ENABLE_THINKING: ${ENABLE_THINKING:-false}
      ENABLE_TOOL_CALLING: ${ENABLE_TOOL_CALLING:-true}
      FILTER_THINKING_FROM_KV_CACHE: ${FILTER_THINKING_FROM_KV_CACHE:-true}
      MAX_NUM_IMAGES: ${MAX_NUM_IMAGES:-4}
      MODEL_PROFILE: ${MODEL_PROFILE:-profiles/default.yaml}
    ports:
      - "${HOST_PORT:-8005}:${SERVER_PORT:-8000}"
    volumes:
      - /volume2/docker/litertlm/litert-home/models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 3G
